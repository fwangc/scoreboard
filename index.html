<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scoreboard">
<meta name="theme-color" content="#000000">
<title>Scoreboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none;
  }
  #board {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    display: flex; flex-direction: column; gap: 3px;
  }
  .row { flex: 1; display: flex; gap: 3px; min-height: 0; }
  .panel { flex: 1; position: relative; min-width: 0; container-type: size; overflow: hidden; }
  .half { position: absolute; left: 0; right: 0; height: 50%; cursor: pointer; }
  .half.inc { top: 0; }
  .half.dec { bottom: 0; }
  .half:active { filter: brightness(1.15); }
  .sym {
    position: absolute; left: 16px; font-size: 34px; font-weight: 700;
    color: rgba(255,255,255,.33); line-height: 1; pointer-events: none;
  }
  .inc .sym { top: 8px; }
  .dec .sym { bottom: 10px; }
  .name {
    position: absolute; top: 10px; left: 50px; right: 70px; text-align: center;
    color: rgba(255,255,255,.87); font-weight: 700; font-size: clamp(16px, 9cqmin, 34px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  }
  .score {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; pointer-events: none; line-height: 1;
    font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
    font-size: min(62cqh, calc(150cqw / var(--chars, 1)));
    font-variant-numeric: tabular-nums;
  }

  /* Tap progress dots shown in the half being tapped */
  .tap-prog {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 20px; letter-spacing: 5px; pointer-events: none;
    color: rgba(255,255,255,.85); z-index: 3;
  }
  .inc .tap-prog { bottom: 6px; }
  .dec .tap-prog { top: 6px; }

  /* Score change history column, right edge of each panel */
  .hist {
    position: absolute; right: 6px; top: 6px; bottom: 6px; width: 72px;
    overflow: hidden; pointer-events: none; z-index: 2;
    display: flex; flex-direction: column; gap: 4px;
  }
  .hist-item {
    font-size: 15px; line-height: 1.3; text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600;
  }
  .hist-item.pos { color: rgba(160,255,160,.7); }
  .hist-item.neg { color: rgba(255,140,140,.7); }

  #control {
    position: fixed; left: 50%; transform: translate(-50%, -50%); top: 50%;
    background: rgba(34,34,34,.8); color: #fff; text-align: center;
    padding: 10px 14px; border-radius: 4px; cursor: pointer; z-index: 5;
    touch-action: none;
  }
  #control.bottom { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); transform: translateX(-50%); }
  #control b { display: block; font-size: 14px; }
  #control small { display: block; font-size: 10px; color: rgba(255,255,255,.4); margin-top: 2px; }
  #control.holding { background: rgba(120,30,30,.9); }

  #setup {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #setup[hidden] { display: none; }
  .sheet {
    background: #1f1f1f; color: #eee; border-radius: 14px; padding: 20px 22px;
    width: min(440px, 100%); max-height: 100%; overflow-y: auto;
    -webkit-user-select: text; user-select: text;
  }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; }
  .sheet label.title { display: block; font-weight: 700; font-size: 14px; margin: 12px 0 8px; color: #bbb; }
  .counts { display: flex; gap: 8px; }
  .counts button {
    flex: 1; font-size: 18px; padding: 10px 0; border-radius: 8px; border: 1px solid #444;
    background: #2a2a2a; color: #eee;
  }
  .counts button.on { background: #1E88E5; border-color: #1E88E5; color: #fff; font-weight: 700; }
  .names input {
    display: block; width: 100%; font-size: 17px; padding: 10px 12px; margin-bottom: 8px;
    border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff;
    border-left: 6px solid var(--c);
  }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .actions button {
    font-size: 16px; padding: 10px 18px; border-radius: 8px; border: 0;
    background: #333; color: #eee;
  }
  .actions button.primary { background: #1E88E5; color: #fff; font-weight: 700; }
</style>
</head>
<body>
<div id="board"></div>

<div id="control" role="button" aria-label="Tap for players, hold to reset">
  <b>RESET</b><small>Hold to reset · Tap for players</small>
</div>

<div id="setup" hidden>
  <form class="sheet" id="setupForm">
    <h2>Players</h2>
    <label class="title">Number of players</label>
    <div class="counts" id="counts"></div>
    <label class="title">Names</label>
    <div class="names" id="names"></div>
    <div class="actions">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">OK</button>
    </div>
  </form>
</div>

<script>
(() => {
  const MIN = 2, MAX = 6, START = 2, HOLD_MS = 700;
  const TAPS_NEEDED = 2, TAP_RESET_MS = 800;
  const STORE = "scoreboard.v1";
  const COLORS = [
    ["#1E88E5", "#0D47A1"], ["#E53935", "#B71C1C"], ["#43A047", "#1B5E20"],
    ["#FB8C00", "#E65100"], ["#8E24AA", "#4A148C"], ["#00897B", "#004D40"],
  ];

  const emptyHistory = () => Array(MAX).fill(null).map(() => []);

  let state = { count: 2, scores: Array(MAX).fill(START), names: Array(MAX).fill(""), history: emptyHistory() };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    if (saved) {
      state = { ...state, ...saved };
      if (!Array.isArray(state.history)) state.history = emptyHistory();
      for (let i = 0; i < MAX; i++) if (!Array.isArray(state.history[i])) state.history[i] = [];
    }
  } catch (e) {}
  state.count = Math.min(MAX, Math.max(MIN, state.count | 0));

  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
  const displayName = i => (state.names[i] || "").trim() || `Player ${i + 1}`;

  // ---- feedback ----
  let audio;
  function feedback(longer) {
    if (navigator.vibrate) navigator.vibrate(longer ? 120 : 30);
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; g.gain.value = 0.08;
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + (longer ? 0.15 : 0.06));
    } catch (e) {}
  }
  function feedbackLight() {
    if (navigator.vibrate) navigator.vibrate(10);
  }

  // ---- tap state: one entry per player ----
  const tapState = Array(MAX).fill(null).map(() => ({ dir: 0, count: 0, timer: null }));

  // ---- board ----
  const board = document.getElementById("board");
  const control = document.getElementById("control");
  let scoreEls = [], progEls = [], histEls = [];

  function rowSizes(n) {
    const portrait = innerHeight > innerWidth;
    if (portrait) return { 2: [1, 1], 3: [1, 1, 1], 4: [2, 2], 5: [2, 2, 1], 6: [2, 2, 2] }[n];
    return { 2: [2], 3: [3], 4: [2, 2], 5: [3, 2], 6: [3, 3] }[n];
  }

  function render() {
    board.innerHTML = "";
    scoreEls = []; progEls = []; histEls = [];
    const rows = rowSizes(state.count);
    let i = 0;
    for (const size of rows) {
      const row = document.createElement("div");
      row.className = "row";
      for (let k = 0; k < size; k++, i++) row.appendChild(panel(i));
      board.appendChild(row);
    }
    const centered = rows.length % 2 === 0 || rows[(rows.length - 1) / 2] % 2 === 0;
    control.classList.toggle("bottom", !centered);
    updateScores();
    for (let j = 0; j < state.count; j++) renderHistory(j);
  }

  function panel(i) {
    const p = document.createElement("div");
    p.className = "panel";

    // Inc half
    const incEl = document.createElement("div");
    incEl.className = "half inc";
    incEl.style.background = COLORS[i][0];
    const incSym = document.createElement("span"); incSym.className = "sym"; incSym.textContent = "+";
    const incProg = document.createElement("div"); incProg.className = "tap-prog";
    incEl.appendChild(incSym); incEl.appendChild(incProg);

    // Dec half
    const decEl = document.createElement("div");
    decEl.className = "half dec";
    decEl.style.background = COLORS[i][1];
    const decSym = document.createElement("span"); decSym.className = "sym"; decSym.textContent = "–";
    const decProg = document.createElement("div"); decProg.className = "tap-prog";
    decEl.appendChild(decSym); decEl.appendChild(decProg);

    const nameEl = document.createElement("div"); nameEl.className = "name"; nameEl.textContent = displayName(i);
    const scoreEl = document.createElement("div"); scoreEl.className = "score";
    const histEl = document.createElement("div"); histEl.className = "hist";

    p.appendChild(incEl); p.appendChild(decEl);
    p.appendChild(nameEl); p.appendChild(scoreEl); p.appendChild(histEl);

    progEls.push({ inc: incProg, dec: decProg });
    scoreEls.push(scoreEl);
    histEls.push(histEl);

    incEl.addEventListener("click", () => handleTap(i, 1));
    decEl.addEventListener("click", () => handleTap(i, -1));
    return p;
  }

  function updateScores() {
    scoreEls.forEach((el, i) => {
      const s = String(state.scores[i]);
      el.textContent = s;
      el.style.setProperty("--chars", Math.max(1, s.length));
    });
  }

  // ---- 3-tap logic ----
  function handleTap(i, d) {
    const ts = tapState[i];
    clearTimeout(ts.timer);

    if (ts.dir !== d) {
      ts.count = 1;
      ts.dir = d;
    } else {
      ts.count++;
    }

    showProgress(i, d, ts.count);

    if (ts.count >= TAPS_NEEDED) {
      ts.count = 0; ts.dir = 0;
      // Keep dots showing briefly so user sees all 3 filled, then clear
      setTimeout(() => clearProgress(i), 350);
      change(i, d);
    } else {
      feedbackLight();
      ts.timer = setTimeout(() => {
        ts.count = 0; ts.dir = 0;
        clearProgress(i);
      }, TAP_RESET_MS);
    }
  }

  function showProgress(i, d, count) {
    if (!progEls[i]) return;
    const filled = '●'.repeat(count);
    const empty = '○'.repeat(TAPS_NEEDED - count);
    if (d > 0) {
      progEls[i].inc.textContent = filled + empty;
      progEls[i].dec.textContent = '';
    } else {
      progEls[i].dec.textContent = filled + empty;
      progEls[i].inc.textContent = '';
    }
  }

  function clearProgress(i) {
    if (!progEls[i]) return;
    progEls[i].inc.textContent = '';
    progEls[i].dec.textContent = '';
  }

  // ---- score change ----
  function change(i, d) {
    const from = state.scores[i];
    state.scores[i] = Math.max(0, state.scores[i] + d);
    const to = state.scores[i];
    if (from !== to) addHistory(i, from, to);
    updateScores();
    save();
    feedback(false);
  }

  function resetScores() {
    state.scores = Array(MAX).fill(START);
    state.history = emptyHistory();
    tapState.forEach(ts => { clearTimeout(ts.timer); ts.count = 0; ts.dir = 0; });
    progEls.forEach((pe, i) => clearProgress(i));
    histEls.forEach(el => { if (el) el.innerHTML = ''; });
    updateScores();
    save();
    feedback(true);
  }

  // ---- history ----
  const MERGE_MS = 10000;

  function addHistory(i, from, to) {
    const nowMs = Date.now();
    const timeStr = new Date(nowMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const dir = Math.sign(to - from);
    const hist = state.history[i];
    const last = hist[0];
    if (last && last.dir === dir && nowMs - last.lastMs < MERGE_MS) {
      last.to = to;
      last.lastMs = nowMs;
    } else {
      hist.unshift({ from, to, dir, time: timeStr, lastMs: nowMs });
      if (hist.length > 20) hist.length = 20;
    }
    renderHistory(i);
  }

  function renderHistory(i) {
    const el = histEls[i];
    if (!el) return;
    el.innerHTML = '';
    for (const entry of state.history[i].slice(0, 10)) {
      if (entry.from == null || entry.to == null) continue;
      const item = document.createElement('div');
      item.className = 'hist-item ' + (entry.dir > 0 ? 'pos' : 'neg');
      item.textContent = entry.from + '→' + entry.to + ' ' + entry.time;
      el.appendChild(item);
    }
  }

  // ---- control: tap = setup, hold = reset ----
  let holdTimer = null, held = false;
  control.addEventListener("pointerdown", e => {
    e.preventDefault();
    held = false;
    control.classList.add("holding");
    holdTimer = setTimeout(() => { held = true; control.classList.remove("holding"); resetScores(); }, HOLD_MS);
  });
  const endPress = open => {
    clearTimeout(holdTimer);
    control.classList.remove("holding");
    if (open && !held) openSetup();
  };
  control.addEventListener("pointerup", () => endPress(true));
  control.addEventListener("pointercancel", () => endPress(false));
  control.addEventListener("pointerleave", () => endPress(false));
  control.addEventListener("contextmenu", e => e.preventDefault());

  // ---- setup dialog ----
  const setup = document.getElementById("setup");
  const countsEl = document.getElementById("counts");
  const namesEl = document.getElementById("names");
  let draftCount = state.count;

  for (let n = MIN; n <= MAX; n++) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = n; b.dataset.n = n;
    b.addEventListener("click", () => { draftCount = n; syncDraft(); });
    countsEl.appendChild(b);
  }
  const inputs = COLORS.map((c, i) => {
    const inp = document.createElement("input");
    inp.maxLength = 16; inp.autocapitalize = "words"; inp.autocomplete = "off";
    inp.placeholder = `Player ${i + 1}`; inp.style.setProperty("--c", c[0]);
    namesEl.appendChild(inp);
    return inp;
  });

  function syncDraft() {
    countsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.n === draftCount));
    inputs.forEach((inp, i) => inp.hidden = i >= draftCount);
  }
  function openSetup() {
    draftCount = state.count;
    inputs.forEach((inp, i) => inp.value = state.names[i] || "");
    syncDraft();
    setup.hidden = false;
  }
  document.getElementById("cancelBtn").addEventListener("click", () => setup.hidden = true);
  setup.addEventListener("click", e => { if (e.target === setup) setup.hidden = true; });
  document.getElementById("setupForm").addEventListener("submit", e => {
    e.preventDefault();
    state.count = draftCount;
    state.names = inputs.map(inp => inp.value.trim());
    state.history = emptyHistory();
    save();
    setup.hidden = true;
    document.activeElement && document.activeElement.blur();
    render();
  });

  // Re-layout when the iPad rotates.
  let lastPortrait = innerHeight > innerWidth;
  addEventListener("resize", () => {
    const p = innerHeight > innerWidth;
    if (p !== lastPortrait) { lastPortrait = p; render(); }
  });

  // Keep the screen awake where supported (Safari 16.4+).
  async function wake() { try { await navigator.wakeLock?.request("screen"); } catch (e) {} }
  wake();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });

  render();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
